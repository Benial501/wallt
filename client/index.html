<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <!--
      Viewport da applicazione, non da sito. maximum-scale=1 + user-scalable=no
      tolgono pinch-zoom e double-tap-zoom su Android Chrome e nella PWA
      installata su iOS (display standalone). Safari iOS in scheda normale
      ignora deliberatamente questi due parametri dal 2016: li' il blocco
      arriva da touch-action in main.css e dal listener gesture* in
      utils/appGestures.js. Vedi anche la nota accessibilita' li'.
      NB: niente viewport-fit=cover, che cambierebbe il layout sui device con
      notch attivando gli env(safe-area-inset-*) oggi inerti.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>WALLT — Gestione Finanziaria</title>
    <meta name="description" content="WALLT - Gestisci il tuo patrimonio, traccia le spese e raggiungi i tuoi obiettivi finanziari. App italiana gratuita.">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WALLT">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!--
      CSP per la SPA. Il backend Express (Helmet) protegge solo le proprie
      risposte JSON/HTML, non questa pagina statica: qui va configurata
      esplicitamente. Deve restare compatibile con Google Identity Services
      (step-up) — accounts.google.com in script-src/frame-src/connect-src —
      senza consentire script-src 'unsafe-eval' o 'unsafe-inline'. style-src
      richiede 'unsafe-inline' per il boot-splash inline sopra e per i
      binding :style di Vue; è un rischio molto minore di uno script-src
      permissivo. Vedi docs/SECURITY.md.

      NOTA connect-src: una source CSP che termina con un path SENZA slash
      finale fa match ESATTO su quel path. Con il solo URL API
      (es. http://localhost:3000/api) ogni chiamata reale (/api/conti,
      /api/auth/login, ...) verrebbe bloccata. Serve quindi anche la forma
      con slash finale, che abilita il match per prefisso su /api/*
      (piu' stretta dell'intera origin).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' __WALLT_API_CSP_SOURCES__ https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background: #06060A;
        font-family: Inter, system-ui, sans-serif;
      }
      .boot-splash__brand {
        display: grid;
        place-items: center;
        padding: 0.875rem 1.125rem;
        border: 1px solid rgba(15, 23, 42, 0.06);
        border-radius: 18px;
        background: #fff;
        animation: boot-splash-arrive 520ms cubic-bezier(0.32, 0.72, 0, 1) both;
      }
      .boot-splash__logo {
        display: block;
        width: clamp(9.5rem, 48vw, 12.5rem);
        height: auto;
        user-select: none;
      }
      @keyframes boot-splash-arrive {
        from { opacity: 0; transform: translateY(3px) scale(0.975); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @media (prefers-color-scheme: light) {
        .boot-splash { background: #EEF1F6; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__brand { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="wallt-runtime-error" hidden style="position:fixed;inset:0;z-index:99999;padding:1.5rem;background:#1a0000;color:#ffb4b4;font:14px/1.5 Inter,system-ui,sans-serif;overflow:auto;"></div>
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-splash__brand">
          <img class="boot-splash__logo" src="/brand/wallt-logo-horizontal.svg" alt="" width="743" height="229" draggable="false">
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
