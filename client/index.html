<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <!--
      Viewport da applicazione, non da sito. maximum-scale=1 + user-scalable=no
      tolgono pinch-zoom e double-tap-zoom su Android Chrome e nella PWA
      installata su iOS (display standalone). Safari iOS in scheda normale
      ignora deliberatamente questi due parametri dal 2016: li' il blocco
      arriva da touch-action in main.css e dal listener gesture* in
      utils/appGestures.js. Vedi anche la nota accessibilita' li'.
      NB: niente viewport-fit=cover, che cambierebbe il layout sui device con
      notch attivando gli env(safe-area-inset-*) oggi inerti.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>WALLT — Gestione Finanziaria</title>
    <meta name="description" content="WALLT - Gestisci il tuo patrimonio, traccia le spese e raggiungi i tuoi obiettivi finanziari. App italiana gratuita.">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WALLT">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!--
      CSP per la SPA. Il backend Express (Helmet) protegge solo le proprie
      risposte JSON/HTML, non questa pagina statica: qui va configurata
      esplicitamente. Deve restare compatibile con Google Identity Services
      (step-up) — accounts.google.com in script-src/frame-src/connect-src —
      senza consentire script-src 'unsafe-eval' o 'unsafe-inline'. style-src
      richiede 'unsafe-inline' per il boot-splash inline sopra e per i
      binding :style di Vue; è un rischio molto minore di uno script-src
      permissivo. Vedi docs/SECURITY.md.

      NOTA connect-src: una source CSP che termina con un path SENZA slash
      finale fa match ESATTO su quel path. Con il solo URL API
      (es. http://localhost:3000/api) ogni chiamata reale (/api/conti,
      /api/auth/login, ...) verrebbe bloccata. Serve quindi anche la forma
      con slash finale, che abilita il match per prefisso su /api/*
      (piu' stretta dell'intera origin).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' __WALLT_API_CSP_SOURCES__ https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      .wallt-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background: #06060A;
        font-family: Inter, system-ui, sans-serif;
        isolation: isolate;
        transition: opacity 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .wallt-splash--leaving {
        opacity: 0;
      }
      .wallt-splash__ambient {
        position: absolute;
        width: min(112vw, 35rem);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 212, 170, 0.2), rgba(21, 164, 211, 0.08) 38%, transparent 70%);
        filter: blur(24px);
        opacity: 0;
        animation: wallt-splash-ambient 1800ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: var(--wallt-splash-delay, 0ms);
        pointer-events: none;
      }
      .wallt-splash__art {
        position: relative;
        width: clamp(13rem, 64vw, 20rem);
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 24%;
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.28);
        animation: wallt-splash-art 1800ms cubic-bezier(0.16, 0.85, 0.28, 1) both;
        animation-delay: var(--wallt-splash-delay, 0ms);
        isolation: isolate;
        will-change: transform, opacity, filter;
      }
      .wallt-splash__logo {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        object-fit: cover;
        user-select: none;
      }
      .wallt-splash__sheen {
        position: absolute;
        inset: -12%;
        background: linear-gradient(112deg, transparent 39%, rgba(255, 255, 255, 0.9) 48%, rgba(75, 255, 218, 0.9) 52%, rgba(255, 255, 255, 0.75) 55%, transparent 63%);
        mix-blend-mode: screen;
        opacity: 0;
        transform: translateX(-120%) rotate(-12deg);
        animation: wallt-splash-sheen 1800ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: var(--wallt-splash-delay, 0ms);
        pointer-events: none;
      }
      .wallt-splash__flare {
        position: absolute;
        top: -8%;
        right: 3%;
        width: 36%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(207, 255, 245, 1) 0%, rgba(0, 212, 170, 0.82) 18%, rgba(0, 212, 170, 0.3) 48%, transparent 72%);
        filter: blur(5px);
        mix-blend-mode: screen;
        opacity: 0;
        transform: scale(0.3);
        animation: wallt-splash-flare 1800ms cubic-bezier(0.16, 1, 0.3, 1) both;
        animation-delay: var(--wallt-splash-delay, 0ms);
        pointer-events: none;
      }
      @keyframes wallt-splash-art {
        0% { opacity: 0; filter: blur(9px); transform: translate3d(0, 18px, 0) scale(0.76) rotate(-7deg); }
        14% { opacity: 1; filter: blur(0); transform: translate3d(0, -5px, 0) scale(1.045) rotate(1.2deg); }
        26% { transform: translate3d(0, 1px, 0) scale(0.99) rotate(-0.4deg); }
        38%, 62% { transform: translate3d(0, 0, 0) scale(1) rotate(0); }
        74% { transform: translate3d(0, -3px, 0) scale(1.025) rotate(0); }
        86%, 100% { transform: translate3d(0, 0, 0) scale(1) rotate(0); }
      }
      @keyframes wallt-splash-ambient {
        0% { opacity: 0; transform: scale(0.38); }
        20% { opacity: 0.55; transform: scale(0.86); }
        58% { opacity: 0.48; transform: scale(1.14); }
        82% { opacity: 0.22; transform: scale(1.3); }
        100% { opacity: 0.08; transform: scale(1.4); }
      }
      @keyframes wallt-splash-sheen {
        0%, 34% { opacity: 0; transform: translateX(-120%) rotate(-12deg); }
        42% { opacity: 0.95; }
        72% { opacity: 0.82; transform: translateX(35%) rotate(-12deg); }
        88%, 100% { opacity: 0; transform: translateX(120%) rotate(-12deg); }
      }
      @keyframes wallt-splash-flare {
        0%, 58% { opacity: 0; transform: scale(0.3); }
        68% { opacity: 0.48; transform: scale(0.78); }
        76% { opacity: 0.95; transform: scale(1.08); }
        85% { opacity: 0.18; transform: scale(1.7); }
        100% { opacity: 0; transform: scale(2); }
      }
      .wallt-splash--reduced .wallt-splash__ambient,
      .wallt-splash--reduced .wallt-splash__sheen,
      .wallt-splash--reduced .wallt-splash__flare {
        display: none;
      }
      .wallt-splash--reduced .wallt-splash__art {
        animation: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .wallt-splash,
        .wallt-splash__ambient,
        .wallt-splash__art,
        .wallt-splash__sheen,
        .wallt-splash__flare {
          animation: none;
          transition: none;
        }
      }
      @media (prefers-color-scheme: light) {
        .wallt-splash { background: #EEF1F6; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="wallt-runtime-error" hidden style="position:fixed;inset:0;z-index:99999;padding:1.5rem;background:#1a0000;color:#ffb4b4;font:14px/1.5 Inter,system-ui,sans-serif;overflow:auto;"></div>
      <div class="wallt-splash" aria-hidden="true">
        <div class="wallt-splash__ambient"></div>
        <div class="wallt-splash__art">
          <img class="wallt-splash__logo" src="/brand/wallt-app-icon.png" alt="" width="512" height="512" draggable="false">
          <span class="wallt-splash__sheen"></span>
          <span class="wallt-splash__flare"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
