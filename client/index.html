<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <!--
      Viewport da applicazione, non da sito. maximum-scale=1 + user-scalable=no
      tolgono pinch-zoom e double-tap-zoom su Android Chrome e nella PWA
      installata su iOS (display standalone). Safari iOS in scheda normale
      ignora deliberatamente questi due parametri dal 2016: li' il blocco
      arriva da touch-action in main.css e dal listener gesture* in
      utils/appGestures.js. Vedi anche la nota accessibilita' li'.
      NB: niente viewport-fit=cover, che cambierebbe il layout sui device con
      notch attivando gli env(safe-area-inset-*) oggi inerti.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>WALLT — Gestione Finanziaria</title>
    <meta name="description" content="WALLT - Gestisci il tuo patrimonio, traccia le spese e raggiungi i tuoi obiettivi finanziari. App italiana gratuita.">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="WALLT">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!--
      CSP per la SPA. Il backend Express (Helmet) protegge solo le proprie
      risposte JSON/HTML, non questa pagina statica: qui va configurata
      esplicitamente. Deve restare compatibile con Google Identity Services
      (step-up) — accounts.google.com in script-src/frame-src/connect-src —
      senza consentire script-src 'unsafe-eval' o 'unsafe-inline'. style-src
      richiede 'unsafe-inline' per la splash inline sopra e per i
      binding :style di Vue; è un rischio molto minore di uno script-src
      permissivo. Vedi docs/SECURITY.md.

      NOTA connect-src: una source CSP che termina con un path SENZA slash
      finale fa match ESATTO su quel path. Con il solo URL API
      (es. http://localhost:3000/api) ogni chiamata reale (/api/conti,
      /api/auth/login, ...) verrebbe bloccata. Serve quindi anche la forma
      con slash finale, che abilita il match per prefisso su /api/*
      (piu' stretta dell'intera origin).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com https://appleid.cdn-apple.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' __WALLT_API_CSP_SOURCES__ https://accounts.google.com https://appleid.apple.com; frame-src https://accounts.google.com https://appleid.apple.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="/manifest-selector.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      .wallt-splash {
        --wallt-splash-bg: #06060A;
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background: var(--wallt-splash-bg);
        color: #FFFFFF;
        font-family: Inter, system-ui, sans-serif;
        isolation: isolate;
        transition: opacity 250ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 250ms cubic-bezier(0.2, 0.8, 0.2, 1);
        will-change: opacity, transform;
      }
      .wallt-splash--leaving { opacity: 0; transform: scale(1.015); }
      .wallt-splash__ambient {
        position: absolute;
        width: min(108vw, 36rem);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 212, 170, 0.19), rgba(116, 185, 255, 0.08) 42%, transparent 72%);
        opacity: 0;
        transform: scale(0.62);
        animation: wallt-splash-ambient 2750ms cubic-bezier(0.2, 0.72, 0.18, 1) both;
        animation-delay: var(--wallt-splash-delay, 0ms);
        pointer-events: none;
      }
      .wallt-splash__current {
        position: absolute;
        width: min(112vw, 38rem);
        height: auto;
        overflow: visible;
        pointer-events: none;
      }
      .wallt-splash__current-line {
        fill: none;
        stroke: url(#wallt-splash-current);
        stroke-width: 1.15;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0;
        animation: wallt-splash-current 2250ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
        animation-delay: var(--wallt-splash-delay, 0ms);
      }
      .wallt-splash__lockup {
        display: flex;
        align-items: center;
        gap: clamp(0.7rem, 3vw, 1.15rem);
        animation: wallt-splash-settle 1950ms cubic-bezier(0.18, 0.78, 0.22, 1) both;
        animation-delay: var(--wallt-splash-delay, 0ms);
        will-change: transform;
      }
      .wallt-splash__mark {
        display: block;
        width: clamp(3.65rem, 17vw, 5.25rem);
        height: auto;
        flex: 0 0 auto;
        overflow: visible;
      }
      .wallt-splash__mark-fill {
        opacity: 0;
        transform: translate3d(-4px, 6px, 0) scale(0.84);
        transform-origin: 50% 50%;
        animation: wallt-splash-mark 1650ms cubic-bezier(0.18, 0.78, 0.22, 1) both;
        animation-delay: var(--wallt-splash-delay, 0ms);
        will-change: transform, opacity;
      }
      .wallt-splash__mark-trace {
        fill: none;
        stroke: rgba(228, 255, 249, 0.94);
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        opacity: 0;
        animation: wallt-splash-trace 2050ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
        animation-delay: var(--wallt-splash-delay, 0ms);
      }
      .wallt-splash__word {
        display: inline-flex;
        align-items: center;
        color: inherit;
        font-size: clamp(2.45rem, 10vw, 3.45rem);
        font-weight: 800;
        letter-spacing: -0.075em;
        line-height: 0.92;
        padding-right: 0.075em;
      }
      .wallt-splash__word span {
        display: block;
        opacity: 0;
        transform: translate3d(9px, 0, 0);
        animation: wallt-splash-letter 980ms cubic-bezier(0.18, 0.78, 0.22, 1) both;
        animation-delay: calc(var(--wallt-splash-delay, 0ms) + var(--wallt-splash-letter-delay, 260ms));
        will-change: transform, opacity;
      }
      @keyframes wallt-splash-ambient {
        0% { opacity: 0; transform: scale(0.62); }
        34% { opacity: 0.34; transform: scale(0.92); }
        74% { opacity: 0.2; transform: scale(1.13); }
        100% { opacity: 0.08; transform: scale(1.27); }
      }
      @keyframes wallt-splash-current {
        0% { opacity: 0; stroke-dashoffset: 1; }
        12% { opacity: 0.78; }
        72% { opacity: 0.52; stroke-dashoffset: 0; }
        100% { opacity: 0; stroke-dashoffset: 0; }
      }
      @keyframes wallt-splash-settle {
        0% { transform: translate3d(0, 10px, 0) scale(0.965); }
        54% { transform: translate3d(0, -1px, 0) scale(1.012); }
        76%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes wallt-splash-mark {
        0% { opacity: 0; transform: translate3d(-4px, 6px, 0) scale(0.84); }
        32% { opacity: 0.34; transform: translate3d(-1px, 1px, 0) scale(0.94); }
        68% { opacity: 1; transform: translate3d(0, 0, 0) scale(1.025); }
        100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes wallt-splash-trace {
        0% { opacity: 0; stroke-dashoffset: 1; }
        8% { opacity: 0.94; }
        68% { opacity: 0.8; stroke-dashoffset: 0; }
        100% { opacity: 0; stroke-dashoffset: 0; }
      }
      @keyframes wallt-splash-letter {
        0% { opacity: 0; transform: translate3d(9px, 0, 0); }
        100% { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      .wallt-splash--reduced .wallt-splash__ambient,
      .wallt-splash--reduced .wallt-splash__current,
      .wallt-splash--reduced .wallt-splash__mark-trace { display: none; }
      .wallt-splash--reduced .wallt-splash__lockup,
      .wallt-splash--reduced .wallt-splash__mark-fill,
      .wallt-splash--reduced .wallt-splash__word span { animation: none; }
      .wallt-splash--reduced .wallt-splash__mark-fill,
      .wallt-splash--reduced .wallt-splash__word span { opacity: 1; transform: none; }
      html.light .wallt-splash { --wallt-splash-bg: #EEF1F6; color: #161821; }
      @media (prefers-color-scheme: light) {
        html:not(.dark) .wallt-splash { --wallt-splash-bg: #EEF1F6; color: #161821; }
      }
      @media (prefers-reduced-motion: reduce) {
        .wallt-splash,
        .wallt-splash * { animation: none !important; transition: none !important; }
        .wallt-splash__ambient,
        .wallt-splash__current,
        .wallt-splash__mark-trace { display: none; }
        .wallt-splash__mark-fill,
        .wallt-splash__word span { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="wallt-runtime-error" hidden style="position:fixed;inset:0;z-index:99999;padding:1.5rem;background:#1a0000;color:#ffb4b4;font:14px/1.5 Inter,system-ui,sans-serif;overflow:auto;"></div>
      <div class="wallt-splash" aria-hidden="true">
        <div class="wallt-splash__ambient"></div>
        <svg class="wallt-splash__current" viewBox="0 0 360 160" preserveAspectRatio="none">
          <defs>
            <linearGradient id="wallt-splash-current" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#74B9FF" stop-opacity="0"></stop>
              <stop offset="0.48" stop-color="#00D4AA" stop-opacity="0.72"></stop>
              <stop offset="1" stop-color="#74B9FF" stop-opacity="0"></stop>
            </linearGradient>
          </defs>
          <path class="wallt-splash__current-line" d="M-24 119C33 118 36 43 102 41C158 39 193 118 251 113C304 109 307 63 384 47" pathLength="1"></path>
        </svg>
        <div class="wallt-splash__lockup">
          <svg class="wallt-splash__mark" viewBox="0 0 100 100" fill="none">
            <defs>
              <linearGradient id="wallt-splash-mark" x1="18" y1="78" x2="86" y2="10" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#2499EE"></stop>
                <stop offset="0.55" stop-color="#27C7D5"></stop>
                <stop offset="1" stop-color="#26DB87"></stop>
              </linearGradient>
            </defs>
            <path class="wallt-splash__mark-fill" d="M15 35H28L39 64L50 35H63L72 60L82 32L75 27L96 8L98 37L89 31L76 69H65L56 47L47 69H34L15 35Z" fill="url(#wallt-splash-mark)"></path>
            <path class="wallt-splash__mark-trace" d="M11 35H28L39 64L50 35H63L72 60L82 32M75 27L96 8L98 37L89 31L76 69H65L56 47L47 69H34L15 35" pathLength="1"></path>
          </svg>
          <span class="wallt-splash__word" aria-hidden="true">
            <span style="--wallt-splash-letter-delay: 820ms">W</span><span style="--wallt-splash-letter-delay: 960ms">A</span><span style="--wallt-splash-letter-delay: 1100ms">L</span><span style="--wallt-splash-letter-delay: 1240ms">L</span><span style="--wallt-splash-letter-delay: 1380ms">T</span>
          </span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
